<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WanderWise — Travel, Wisely</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --sky:#BFE3F0;
  --peach:#FFD9C4;
  --sage:#CFE8D4;
  --lavender:#E3D5F2;
  --coral:#FF9376;
  --ink:#3A3142;
  --ink-soft:#6E6478;
  --cream:#FBF8F3;
  --card:#FFFFFF;
  --line:#ECE4F0;
  --gold:#E8B23C;
  --radius:18px;
  --shadow: 0 8px 30px rgba(85,60,110,0.08);
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Inter',sans-serif;background:var(--cream);color:var(--ink);}
h1,h2,h3,h4{font-family:'Fraunces',serif;font-weight:600;margin:0;color:var(--ink);}
button{font-family:'Inter',sans-serif;cursor:pointer;}
input,select,textarea{font-family:'Inter',sans-serif;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--lavender);border-radius:10px;}

a{color:inherit;}
.app{min-height:100vh;display:flex;flex-direction:column;}

/* ---------- TOPNAV ---------- */
.topnav{display:flex;align-items:center;justify-content:space-between;padding:16px 32px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50;}
.brand{display:flex;align-items:center;gap:10px;font-family:'Fraunces',serif;font-size:22px;font-weight:700;letter-spacing:-0.5px;cursor:pointer;}
.brand .mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--sky),var(--lavender));display:flex;align-items:center;justify-content:center;font-size:18px;}
.navlinks{display:flex;gap:6px;align-items:center;}
.navlinks button{background:transparent;border:none;padding:9px 16px;border-radius:999px;font-size:14.5px;font-weight:600;color:var(--ink-soft);transition:.2s;}
.navlinks button.active, .navlinks button:hover{background:var(--lavender);color:var(--ink);}
.navuser{display:flex;align-items:center;gap:10px;}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--coral),var(--gold));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px;}
.btn{border:none;border-radius:999px;padding:11px 22px;font-weight:700;font-size:14.5px;transition:.15s;}
.btn-primary{background:var(--coral);color:#fff;box-shadow:0 6px 18px rgba(255,147,118,.35);}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(255,147,118,.45);}
.btn-ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink);}
.btn-ghost:hover{background:var(--lavender);}
.btn-sm{padding:7px 14px;font-size:13px;}

/* ---------- LAYOUT ---------- */
.page{flex:1;width:100%;}
.wrap{max-width:1180px;margin:0 auto;padding:36px 28px 80px;}
.center-wrap{max-width:440px;margin:0 auto;padding:60px 24px;}

/* ---------- AUTH ---------- */
.auth-shell{min-height:100vh;display:flex;}
.auth-art{flex:1;background:linear-gradient(160deg,var(--sky),var(--lavender) 60%, var(--peach));display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;}
.auth-art::before, .auth-art::after{content:'';position:absolute;border-radius:50%;}
.auth-art::before{width:280px;height:280px;background:rgba(255,255,255,.35);top:-60px;left:-60px;}
.auth-art::after{width:200px;height:200px;background:rgba(255,255,255,.25);bottom:-40px;right:-20px;}
.auth-art .quote{position:relative;z-index:2;max-width:380px;padding:40px;color:#3A3142;}
.auth-art .quote h2{font-size:30px;line-height:1.25;margin-bottom:14px;}
.auth-art .quote p{font-size:15px;color:#564B61;}
.auth-form-side{flex:1;display:flex;align-items:center;justify-content:center;padding:40px;}
.auth-card{width:100%;max-width:380px;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}
.field input{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);font-size:14.5px;background:#fff;outline:none;transition:.15s;}
.field input:focus{border-color:var(--coral);box-shadow:0 0 0 3px rgba(255,147,118,.15);}
.auth-link{color:var(--coral);font-weight:600;text-decoration:none;cursor:pointer;}
.helper{font-size:13.5px;color:var(--ink-soft);margin-top:18px;text-align:center;}
.error-msg{background:#FFE9E3;color:#C1492A;padding:10px 14px;border-radius:10px;font-size:13.5px;margin-bottom:14px;}
.success-msg{background:#E1F2E4;color:#2E7D4F;padding:10px 14px;border-radius:10px;font-size:13.5px;margin-bottom:14px;}

/* ---------- HERO / HOME ---------- */
.hero{background:linear-gradient(135deg,var(--sky) 0%, var(--lavender) 50%, var(--peach) 100%);border-radius:28px;padding:56px 44px;margin-bottom:40px;position:relative;overflow:hidden;}
.hero h1{font-size:40px;line-height:1.15;max-width:600px;}
.hero p{font-size:16px;color:#564B61;margin-top:14px;max-width:520px;}
.search-bar{margin-top:28px;display:flex;gap:10px;background:#fff;padding:8px;border-radius:16px;box-shadow:var(--shadow);max-width:560px;}
.search-bar input{flex:1;border:none;outline:none;padding:12px 14px;font-size:15px;border-radius:10px;}
.search-bar button{background:var(--ink);color:#fff;border:none;border-radius:10px;padding:0 22px;font-weight:700;font-size:14px;}
.chips{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap;}
.chip{background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.8);padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s;}
.chip:hover{background:#fff;}

.section-title{font-size:22px;margin:36px 0 18px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;}
.dest-card{background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:.2s;border:1px solid var(--line);}
.dest-card:hover{transform:translateY(-4px);box-shadow:0 14px 32px rgba(85,60,110,.14);}
.dest-card .img{height:130px;display:flex;align-items:center;justify-content:center;font-size:44px;}
.dest-card .body{padding:16px;}
.dest-card .body h4{font-size:16.5px;}
.dest-card .body .tag{font-size:12.5px;color:var(--ink-soft);margin-top:4px;}
.badge{display:inline-block;background:var(--sage);color:#2E6B41;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;margin-top:8px;}

/* ---------- DESTINATION PAGE ---------- */
.dest-hero{border-radius:24px;padding:42px;background:linear-gradient(135deg,var(--peach),var(--sky));margin-bottom:28px;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:18px;}
.dest-hero .icon{font-size:60px;}
.dest-hero h1{font-size:36px;}
.dest-hero .meta{display:flex;gap:18px;margin-top:10px;flex-wrap:wrap;}
.dest-hero .meta span{font-size:13.5px;font-weight:600;background:rgba(255,255,255,.65);padding:6px 12px;border-radius:999px;}
.tabbar{display:flex;gap:6px;margin-bottom:22px;border-bottom:1.5px solid var(--line);overflow-x:auto;}
.tabbar button{background:none;border:none;padding:12px 18px;font-weight:700;font-size:14px;color:var(--ink-soft);border-bottom:3px solid transparent;white-space:nowrap;}
.tabbar button.active{color:var(--coral);border-color:var(--coral);}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);}
.two-col{display:grid;grid-template-columns:1.3fr 1fr;gap:22px;}
@media(max-width:860px){.two-col{grid-template-columns:1fr;}.auth-shell{flex-direction:column;}.auth-art{min-height:220px;}}

.list-item{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);}
.list-item:last-child{border-bottom:none;}
.list-item .ic{width:42px;height:42px;border-radius:12px;background:var(--lavender);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.list-item h4{font-size:15px;margin-bottom:3px;}
.list-item p{font-size:13.5px;color:var(--ink-soft);margin:0;line-height:1.5;}
.price-tag{font-size:12.5px;font-weight:700;color:var(--gold);margin-left:auto;white-space:nowrap;}

.pill-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
.pill{background:var(--sage);color:#2E6B41;font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;}
.pill.peach{background:var(--peach);color:#A35A2A;}
.pill.sky{background:var(--sky);color:#21617A;}
.pill.lav{background:var(--lavender);color:#5C3D8A;}

/* ---------- BUDGET PLANNER ---------- */
.budget-form{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px;}
.budget-form .field{margin-bottom:0;}
.bar-row{margin-bottom:14px;}
.bar-row .lbl{display:flex;justify-content:space-between;font-size:13.5px;font-weight:600;margin-bottom:6px;}
.bar-track{height:10px;background:var(--line);border-radius:999px;overflow:hidden;}
.bar-fill{height:100%;border-radius:999px;}

/* ---------- JOURNAL ---------- */
.journal-entry{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow);}
.journal-entry .top{display:flex;justify-content:space-between;align-items:flex-start;}
.journal-entry .date{font-size:12.5px;color:var(--ink-soft);font-weight:600;}
.journal-photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
.journal-photos img{width:90px;height:90px;object-fit:cover;border-radius:12px;}
textarea.field-input{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14.5px;resize:vertical;min-height:90px;outline:none;}
textarea.field-input:focus{border-color:var(--coral);}

/* ---------- PROFILE ---------- */
.profile-head{display:flex;gap:22px;align-items:center;margin-bottom:30px;}
.profile-avatar{width:84px;height:84px;border-radius:50%;background:linear-gradient(135deg,var(--coral),var(--gold));display:flex;align-items:center;justify-content:center;color:#fff;font-size:32px;font-weight:700;}
.stat-row{display:flex;gap:14px;margin-top:10px;}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px;text-align:center;min-width:90px;}
.stat .n{font-family:'Fraunces',serif;font-size:22px;font-weight:700;color:var(--coral);}
.stat .l{font-size:11.5px;color:var(--ink-soft);font-weight:600;}

.empty{text-align:center;padding:50px 20px;color:var(--ink-soft);}
.empty .e-icon{font-size:42px;margin-bottom:10px;}

.weather-strip{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;}
.wcard{flex-shrink:0;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;text-align:center;min-width:88px;}
.wcard .m{font-size:11.5px;color:var(--ink-soft);font-weight:700;}
.wcard .ic{font-size:22px;margin:6px 0;}
.wcard .t{font-size:13px;font-weight:700;}

footer{text-align:center;padding:26px;color:var(--ink-soft);font-size:12.5px;}

/* ---------- SPLASH ---------- */
.splash{position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;flex-direction:column;background:linear-gradient(150deg,var(--sky) 0%, var(--lavender) 55%, var(--peach) 100%);animation:fadeOutSplash .6s ease forwards;animation-delay:1.9s;}
.splash .mark{width:96px;height:96px;border-radius:26px;background:rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;font-size:48px;animation:popIn .7s cubic-bezier(.34,1.56,.64,1) both;box-shadow:0 14px 40px rgba(85,60,110,.18);}
.splash h1{font-family:'Fraunces',serif;font-size:38px;margin-top:20px;color:var(--ink);opacity:0;animation:riseIn .6s ease forwards;animation-delay:.35s;letter-spacing:-.5px;}
.splash p{font-size:14.5px;color:#564B61;margin-top:8px;opacity:0;animation:riseIn .6s ease forwards;animation-delay:.55s;}
.splash .dots{display:flex;gap:7px;margin-top:26px;opacity:0;animation:riseIn .6s ease forwards;animation-delay:.75s;}
.splash .dots span{width:8px;height:8px;border-radius:50%;background:var(--coral);animation:bounceDot 1s infinite ease-in-out;}
.splash .dots span:nth-child(2){animation-delay:.15s;}
.splash .dots span:nth-child(3){animation-delay:.3s;}
@keyframes popIn{0%{transform:scale(.4) rotate(-8deg);opacity:0;}100%{transform:scale(1) rotate(0);opacity:1;}}
@keyframes riseIn{0%{transform:translateY(14px);opacity:0;}100%{transform:translateY(0);opacity:1;}}
@keyframes bounceDot{0%,80%,100%{transform:translateY(0);opacity:.5;}40%{transform:translateY(-8px);opacity:1;}}
@keyframes fadeOutSplash{0%{opacity:1;visibility:visible;}99%{opacity:0;visibility:visible;}100%{opacity:0;visibility:hidden;pointer-events:none;}}

.modal-bg{position:fixed;inset:0;background:rgba(58,49,66,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal{background:#fff;border-radius:20px;padding:28px;max-width:420px;width:100%;}
</style>
</head>
<body>
<div id="splash" class="splash">
  <div class="mark">🧭</div>
  <h1>WanderWise</h1>
  <p>Travel, wisely.</p>
  <div class="dots"><span></span><span></span><span></span></div>
</div>
<div id="root" class="app"></div>

<script>
setTimeout(()=>{ const s=document.getElementById('splash'); if(s) s.remove(); }, 2600);
</script>

function hashStr(s){let h=0;for(let i=0;i<s.length;i++){h=(h<<5)-h+s.charCodeAt(i);h|=0;}return Math.abs(h);}

function generateGenericCity(query){
  const h = hashStr(query.toLowerCase());
  const icons=["🌍","🏙️","🏞️","⛰️","🏝️","🛶","🕌","🏯"];
  const climates=["Tropical","Temperate","Mediterranean","Alpine","Desert","Coastal"];
  const bestTimes=["October to March","April to June","November to February","March to May, Sep-Nov"];
  const months=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"].map((m,i)=>{
    const icons2=["☀️","🌤️","🌦️","🌧️","❄️","🍂"];
    const temp = 10 + ((h+i*7)%25);
    return [m, icons2[(h+i)%icons2.length], temp+"°C"];
  });
  const name = query.charAt(0).toUpperCase()+query.slice(1);
  return {
    name, region:"Explore & discover", icon: icons[h%icons.length], tagline:"A destination worth discovering",
    bestTime: bestTimes[h%bestTimes.length], climate: climates[h%climates.length], idealDays: (2+(h%4))+"-"+(3+(h%4))+" days",
    months,
    attractions:[
      {n:name+" Old Town", t:"Heritage", d:"The historic heart of "+name+", filled with local architecture and culture.", price:"Free"},
      {n:name+" Central Market", t:"Local Life", d:"A bustling market great for local snacks, crafts and souvenirs.", price:"Free entry"},
      {n:name+" Viewpoint", t:"Viewpoint", d:"A popular spot for panoramic views, especially around sunset.", price:"Free"},
      {n:name+" Nature Trail", t:"Nature", d:"A scenic trail just outside the city, ideal for a half-day outing.", price:"Free"}
    ],
    food:[
      {n:"The Local Kitchen", t:"Regional Cuisine", d:"A well-loved spot for authentic regional dishes at fair prices.", price:"Budget-friendly"},
      {n:name+" Food Street", t:"Street Food", d:"A lively strip of stalls serving local street-food favourites.", price:"Very affordable"},
      {n:"Heritage Dining House", t:"Fine Dining", d:"A higher-end restaurant known for a refined take on local flavours.", price:"Mid-to-high range"}
    ],
    stay:[
      {n:name+" Backpackers Hostel", t:"Budget", d:"Clean dorms and social common spaces for budget travellers.", price:"Low cost/night"},
      {n:name+" Comfort Inn", t:"Mid-range", d:"Reliable mid-range hotel close to the main attractions.", price:"Moderate/night"},
      {n:"Grand "+name+" Resort", t:"Luxury", d:"A premium stay with top-tier amenities and service.", price:"Premium/night"}
    ],
    packing:["Comfortable walking shoes","Weather-appropriate clothing","Power bank & adapter","Reusable water bottle","Basic first-aid kit","Copies of ID/documents"],
    vibe:["Hidden Gem","Local Culture","Worth Exploring"]
  };
}

function getCity(query){
  const key = query.trim().toLowerCase();
  if(CITY_DB[key]) return CITY_DB[key];
  for(const k in CITY_DB){ if(k.includes(key) || key.includes(k)) return CITY_DB[k]; }
  return generateGenericCity(query.trim() || "Somewhere New");
}

function doLogin(){
  const email = document.getElementById('li-email').value.trim().toLowerCase();
  const pass = document.getElementById('li-pass').value;
  if(!email || !pass){ setState({authError:"Please enter both email and password."}); return; }
  const u = state.users[email];
  if(!u || u.password!==pass){ setState({authError:"Email or password is incorrect."}); return; }
  setState({user:{name:u.name, email}, page:'home', authError:'', authSuccess:''});
}

function doSignup(){
  const name = document.getElementById('su-name').value.trim();
  const email = document.getElementById('su-email').value.trim().toLowerCase();
  const pass = document.getElementById('su-pass').value;
  const pass2 = document.getElementById('su-pass2').value;
  if(!name||!email||!pass||!pass2){ setState({authError:"Please fill in every field."}); return; }
  if(pass.length<6){ setState({authError:"Password must be at least 6 characters."}); return; }
  if(pass!==pass2){ setState({authError:"Passwords don't match."}); return; }
  if(state.users[email]){ setState({authError:"An account with this email already exists."}); return; }
  const users = {...state.users, [email]:{name,password:pass}};
  setState({users, user:{name,email}, page:'home', authError:''});
}

function doForgot(){
  const email = document.getElementById('fg-email').value.trim().toLowerCase();
  if(!email){ setState({authError:"Please enter your email.", authSuccess:''}); return; }
  if(!state.users[email]){ setState({authError:"No account found with that email.", authSuccess:''}); return; }
  setState({authSuccess:"A password reset link has been sent to "+email+" (simulated).", authError:''});
}

function calcBudget(){
  const place = document.getElementById('pl-place').value || 'Your destination';
  const budget = parseFloat(document.getElementById('pl-budget').value) || 0;
  const days = parseInt(document.getElementById('pl-days').value) || 1;
  const people = parseInt(document.getElementById('pl-people').value) || 1;
  const style = document.getElementById('pl-style').value;
  const resultEl = document.getElementById('planner-result');

  if(budget<=0){ resultEl.innerHTML = `<div class="error-msg">Please enter a valid total budget to generate a plan.</div>`; return; }

  const split = {stay:0.38, food:0.27, transport:0.15, activities:0.13, buffer:0.07};
  const c = getCity(place);
  let pick = c.stay[1];
  if(style==='budget') pick = c.stay[0];
  if(style==='luxury') pick = c.stay[2];
  let foodPick = style==='luxury' ? c.food[c.food.length-1] : c.food[0];

  const perPersonPerDay = Math.round(budget/(days*people));
  let tier = "tight";
  if(perPersonPerDay>3000) tier="comfortable";
  if(perPersonPerDay>7000) tier="generous";

  resultEl.innerHTML = `
    <div class="card" style="margin-bottom:18px;">
      <h3 style="margin-bottom:6px;">Your plan for ${place}</h3>
      <p style="color:var(--ink-soft);font-size:14px;margin-bottom:18px;">≈ ₹${perPersonPerDay.toLocaleString()} per person, per day — that's a <b>${tier}</b> budget for ${days} day(s) with ${people} traveller(s).</p>
      ${Object.entries(split).map(([k,v])=>{
        const amt = Math.round(budget*v);
        const labels = {stay:'🛏️ Stay', food:'🍴 Food', transport:'🚕 Local transport', activities:'🎟️ Activities & entry fees', buffer:'💰 Buffer / shopping'};
        const colors = {stay:'var(--sky)', food:'var(--peach)', transport:'var(--lavender)', activities:'var(--sage)', buffer:'#FFE9A8'};
        return `<div class="bar-row"><div class="lbl"><span>${labels[k]}</span><span>₹${amt.toLocaleString()}</span></div><div class="bar-track"><div class="bar-fill" style="width:${v*100}%;background:${colors[k]};"></div></div></div>`;
      }).join('')}
    </div>
    <div class="two-col">
      <div class="card">
        <h4 style="margin-bottom:12px;">Our recommendation</h4>
        <div class="list-item"><div class="ic">🛏️</div><div><h4>Stay at ${pick.n}</h4><p>${pick.d} <br>Around ${pick.price}, fits your ${style} style.</p></div></div>
        <div class="list-item"><div class="ic">🍴</div><div><h4>Eat at ${foodPick.n}</h4><p>${foodPick.d} <br>Approx. ${foodPick.price}.</p></div></div>
        <div class="list-item"><div class="ic">📍</div><div><h4>Don't miss ${c.attractions[0].n}</h4><p>${c.attractions[0].d}</p></div></div>
      </div>
      <div class="card">
        <h4 style="margin-bottom:12px;">Carry these for your trip</h4>
        ${c.packing.slice(0,6).map(p=>`<div class="list-item" style="border:none;padding:8px 0;"><div class="ic" style="width:30px;height:30px;font-size:14px;background:var(--sage);">✓</div><p style="font-size:14px;">${p}</p></div>`).join('')}
        <button class="btn btn-ghost btn-sm" style="margin-top:8px;" onclick="openCity('${c.name}')">See full guide for ${c.name} →</button>
      </div>
    </div>
  `;
}

function handlePhotoSelect(ev){
  const files = Array.from(ev.target.files).slice(0,6);
  pendingPhotos = [];
  const preview = document.getElementById('photo-preview');
  preview.innerHTML = '';
  files.forEach(f=>{
    const reader = new FileReader();
    reader.onload = e=>{
      pendingPhotos.push(e.target.result);
      const img = document.createElement('img');
      img.src = e.target.result;
      preview.appendChild(img);
    };
    reader.readAsDataURL(f);
  });
}

function addJournalEntry(){
  const place = document.getElementById('j-place').value.trim();
  const date = document.getElementById('j-date').value;
  const text = document.getElementById('j-text').value.trim();
  if(!place || !text){ alert('Please add a place and your story before saving.'); return; }
  const entry = {id:Date.now(), place, date, text, photos:[...pendingPhotos]};
  pendingPhotos = [];
  setState({journal:[...state.journal, entry], journalDraftPlace:''});
}

          </select>
        </div>
        <div class="field"><label>Favourite trip type</label>
          <select style="width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);">
            <option>Beaches</option><option>Mountains</option><option>Heritage & Culture</option><option>Food Trails</option>
          </select>
        </div>
        <p style="font-size:12.5px;color:var(--ink-soft);margin-top:10px;">Preferences are saved for this session and help tailor future suggestions.</p>
      </div>
    </div>
  </div></div>
  <footer>WanderWise — plan less, wander more 🌿</footer>`;
}

/* ================= ROUTER / RENDER ================= */
function render(){
  const root = document.getElementById('root');
  let html = '';
  if(!state.user){
    if(state.page==='signup') html = renderSignup();
    else if(state.page==='forgot') html = renderForgot();
    else html = renderLogin();
  } else {
    if(state.page==='destination' && state.currentCity) html = renderDestination();
    else if(state.page==='planner') html = renderPlanner();
    else if(state.page==='journal') html = renderJournal();
    else if(state.page==='profile') html = renderProfile();
    else html = renderHome();
  }
  root.innerHTML = html;
}

render();
</script>
</body>
</html>
